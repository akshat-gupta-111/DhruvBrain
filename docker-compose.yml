
services:
  imu-dashboard:
    build:
      context: ./imu_dashboard
      dockerfile: Dockerfile
    container_name: imu-dashboard
    restart: unless-stopped
    network_mode: host
    privileged: true
    devices:
      - "/dev/i2c-7:/dev/i2c-7"
    environment:
      - IMU_I2C_BUS=${IMU_I2C_BUS:-7}
      - IMU_I2C_ADDRESS=${IMU_I2C_ADDRESS:-0x68}
      - IMU_SAMPLE_HZ=${IMU_SAMPLE_HZ:-50}
      - IMU_DASHBOARD_PORT=${IMU_DASHBOARD_PORT:-6769}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('IMU_DASHBOARD_PORT', '6769') + '/', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  dhruv-brain:
    build: .
    container_name: dhruv-brain-container
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - ENV=PROD_JETSON
      # ── Audio Sidecar ─────────────────────────────────────────────
      # audio_server.py runs on the Jetson HOST (outside Docker).
      # network_mode: host means localhost here = Jetson localhost.
      - AUDIO_SERVER_URL=http://localhost:5555

    # host networking: container shares Jetson's network stack directly.
    # localhost:5555 inside container = audio_server.py on the Jetson host.
    # This also eliminates the need for port mapping.
    network_mode: host

    # Required to access physical USB devices
    privileged: true

    # Map physical hardware into container
    devices:
      - "/dev/video0:/dev/video0"      # USB Webcam
      - "/dev/ttyACM0:/dev/ttyACM0"   # Arduino Uno R4
      # /dev/snd intentionally omitted — audio handled on host by audio_server.py

    volumes:
      - .:/app
      - "/var/run/dbus:/var/run/dbus"  # Required for BLE (bleak/BlueZ) to access host Bluetooth
