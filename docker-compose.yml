

services:
  dhruv-brain:
    build: .
    container_name: dhruv-brain-container
    restart: unless-stopped
    
    env_file:
      - .env
      
    # Triggers core/hal.py to load hal_jetson.py
    environment:
      - ENV=PROD_JETSON
      # ALSA card name for ReSpeaker — use card name (stable) not index (shifts on replug)
      # Run `aplay -l` on Jetson to confirm the exact card name
      - ALSA_DEVICE=plughw:2,0
      
    ports:
      - "8000:8000"
      
    # Required to access physical USB and Audio devices
    privileged: true
    
    # Map the Jetson's physical hardware directly into the container
    devices:
      - "/dev/video0:/dev/video0"      # USB Webcam
      - "/dev/ttyACM0:/dev/ttyACM0"    # Arduino Uno R4 
      - "/dev/snd:/dev/snd"            # Audio Subsystem (Mic/Speaker)
      
    volumes:
      - .:/app
