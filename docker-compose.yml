

services:
  dhruv-brain:
    build: .
    container_name: dhruv-brain-container
    restart: unless-stopped
    
    env_file:
      - .env
      
    # Triggers core/hal.py to load hal_jetson.py
    environment:
      - ENV=PROD_JETSON
      # ── Speaker ─────────────────────────────────────────
      # ALSA card for playback. Run `aplay -l` on Jetson to confirm.
      - ALSA_DEVICE=plughw:2,0
      # ── Microphone (sounddevice, same as utility.py) ────
      # Capture device index. Run `python -c "import sounddevice as sd; print(sd.query_devices())"` on Jetson.
      - INPUT_DEVICE_INDEX=26
      # Channel count for ReSpeaker 4-Mic Array
      - MIC_CHANNELS=6
      # RMS energy threshold for VAD — raise if too much noise triggers STT
      - SPEECH_RMS_THRESHOLD=300
      
    ports:
      - "8000:8000"
      
    # Required to access physical USB and Audio devices
    privileged: true
    
    # Map the Jetson's physical hardware directly into the container
    devices:
      - "/dev/video0:/dev/video0"      # USB Webcam
      - "/dev/ttyACM0:/dev/ttyACM0"    # Arduino Uno R4 
      - "/dev/snd:/dev/snd"            # Audio Subsystem (Mic/Speaker)
      
    volumes:
      - .:/app
